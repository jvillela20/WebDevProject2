{% load static %}
<!-- SLIDER -->
<section style="background: url('{% static 'images/uploads/slider-bg.jpg' %}') no-repeat center center; background-size:cover; position:relative; padding: 100px 0 60px 0; min-height:560px;">
    <div class="container">
        <div class="title-hd" style="padding:0 15px;margin-bottom:20px;">
            <h2 style="color:#fff;font-family:'Dosis',sans-serif;font-size:24px;font-weight:bold;letter-spacing:2px;">Now Playing</h2>
            <a href="#" class="viewall" style="color:#abb7c4;">View All <i class="fa fa-angle-right"></i></a>
        </div>
        <div style="display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:20px;padding:0 15px;">
            {% for slide in sliders %}
            <div class="movie-item" style="min-width:200px;flex-shrink:0;position:relative;">
                <div class="mv-img">
                    <a href="{{ slide.anchor_url }}">
                        <img src="{{ slide.image_src }}" width="{{ slide.image_width }}" height="{{ slide.image_height }}" alt="{{ slide.movie_title }}" style="border-radius:5px;display:block;">
                    </a>
                </div>
                <div class="title-in" style="position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(transparent, rgba(0,0,0,0.85));">
                    <h6 style="color:#fff;font-family:'Dosis',sans-serif;font-weight:bold;margin-bottom:5px;">{{ slide.movie_title }}</h6>
                    <p style="margin:0;display:flex;align-items:center;gap:6px;">
                        <span style="background-color:#dd003f;color:#fff;padding:2px 6px;font-size:10px;border-radius:2px;font-weight:bold;">{{ slide.movie_genre }}</span>
                        <i class="fa fa-star" style="color:#dcf836;font-size:11px;"></i>
                        <span style="color:#fff;font-size:12px;">{{ slide.lower_rating }}/{{ slide.upper_rating }}</span>
                    </p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
