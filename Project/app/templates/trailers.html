{% load static %}
<!-- TRAILERS -->
<div class="trailers full-width">
    <div class="container">
        <div class="title-hd">
            <h2>In Theater</h2>
            <a href="#" class="viewall">View All <i class="fa fa-angle-right"></i></a>
        </div>

        <div class="videos">
            <!-- DB: Trailer main video -->
            <div class="video-ft">
                {% for trailer in trailers %}
                <iframe class="item-video" src="{{ trailer.trailer_URL }}" frameborder="0" allowfullscreen></iframe>
                {% empty %}
                <iframe class="item-video" src="https://www.youtube.com/embed/2LqzF5WauAw" frameborder="0" allowfullscreen></iframe>
                {% endfor %}
            </div>

            <!-- DB: TrailerItem thumbnails -->
            <div class="thumb-ft" style="overflow-y:auto;">
                {% for item in trailer_items %}
                <div style="display:flex;flex-direction:row;align-items:center;padding:10px 15px;cursor:pointer;border-bottom:1px solid #1a3a52;" {% if forloop.first %}class="slick-current"{% endif %}>
                    <div class="trailer-img" style="flex-shrink:0;">
                        <img src="{{ item.img_src }}" alt="{{ item.img_alt }}" width="{{ item.img_width }}" height="{{ item.img_height }}">
                    </div>
                    <div class="trailer-infor" style="margin-left:15px;">
                        <p class="desc">{{ item.description }}</p>
                        <p>{{ item.duration }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

    </div>
</div>
